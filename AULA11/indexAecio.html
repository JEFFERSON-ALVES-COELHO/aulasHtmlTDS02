            // atividade rapida
            // com a variavel 'nota', decida se o aluno foi aprovado ou reprovado, considerando a média de 7 para aprovação
            // caso seja reprovado , imforme o quanto faltou para ele alcançar a media (7)

            function verificarAprovacao(nota){
                let media = 7;
                if(nota >= media){
                    console.log("Aluno aprovado!");

                    let faltou = media - nota;
