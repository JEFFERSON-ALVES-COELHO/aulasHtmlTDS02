<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>  
    .container {
    display: flex;
    background-color: rgb(221, 247, 109);
    width: 500px;
    height: 80px;

    justify-content: space-between; /* A esquerda, B centro, C direita */
    align-items: center;            /* centraliza vertical */
}
      </style>
</head>

<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
