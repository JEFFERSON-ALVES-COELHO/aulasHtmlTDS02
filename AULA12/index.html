<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de API ViaCep</title>
    <link rel="shortcut icon" href="../AULA12/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../AULA12/css/style.css">
</head>
<body>
     <div class="container">
        <h1>Consulta de CEP</h1>
        
        <!-- Campo para digitar o CEP -->
         <div class="grupo-entrada-cep">
        <label for="cep">Digite o CEP:</label>
        <input type="text" id="cep" name="cep" maxlength="8">
        <button id="btnBuscar">Buscar</button>
        </div>

        <!-- Campo preenchidos automaticamnete -->
         <div class="grupo-campos">
        <label for="logradouro">Logradouro:</label>
        <input type="text" id="logradouro" readonly/>
        </div>

        <div class="grupo-campos">
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" readonly/>
        </div>
        
        <div class="linha-dois-campos">
        <div class="grupo-campos">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" readonly/>
        </div>

        <div class="grupo-campos">
        <label for="estado">Estado:</label>
        <input  type="text" id="estado" readonly/>
        </div>
        </div>
        </div>
     
    <script src="./js/script.js"></script>
</body>
</html>
